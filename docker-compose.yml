version: '3.9'

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: kripto_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    networks:
      - kripto_net

  laravel:
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    container_name: kripto_laravel
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      CHACHA20_SERVICE_URL: http://python:8001
      CHACHA20_SERVICE_TIMEOUT: 30

      CAESAR_SERVICE_URL: http://python-caesar:8000
      CAESAR_SERVICE_TIMEOUT: 30
    depends_on:
      mysql:
        condition: service_healthy
      python:
        condition: service_started
    networks:
      - kripto_net

  python:
    build:
      context: ./chacha20-api
      dockerfile: ../docker/python/Dockerfile
    container_name: kripto_python
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - kripto_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  python-caesar:
    build:
      context: ./caesar-api
      dockerfile: ../docker/python/Dockerfile
    container_name: kripto_python_caesar
    restart: unless-stopped
    ports:
      - "5001:8000"
    networks:
      - kripto_net

  mysql:
    image: mysql:8.0
    container_name: kripto_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kripto_simulator}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - kripto_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kripto_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local